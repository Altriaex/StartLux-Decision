name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command and, if possible, a request body that shows the problem. Remove anything private.
      render: shell
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: StartLux-Decision-4B-AutoThink
  - type: input
    id: engine
    attributes:
      label: Engine and version
      placeholder: vLLM 0.31.0 / llama.cpp b11549 / mlx-vlm 0.7.6
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Package version or commit, Python version, GPU or Apple chip, operating system.
