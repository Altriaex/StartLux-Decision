name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
        extras: ["stdlib", "server"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the server dependency
        if: matrix.extras == 'server'
        run: pip install "aiohttp>=3.9" numpy
      - name: Run the unit tests
        run: python -m unittest -v
